<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="450" fill="#0F172A"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1"/>
  </pattern>
  <rect width="800" height="450" fill="url(#grid)" opacity="0.3"/>

  <!-- Header bar -->
  <rect x="20" y="20" width="760" height="60" rx="12" fill="#1E293B"/>
  <text x="40" y="55" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#10B981">Dashboard Pro</text>

  <!-- Stats cards -->
  <g id="stats-cards">
    <!-- Card 1 -->
    <rect x="20" y="100" width="180" height="120" rx="12" fill="#16A34A" opacity="0.2"/>
    <rect x="20" y="100" width="180" height="120" rx="12" fill="none" stroke="#10B981" stroke-width="2"/>
    <text x="40" y="130" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Ingresos</text>
    <text x="40" y="165" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#10B981">$12.5k</text>
    <text x="40" y="195" font-family="Arial, sans-serif" font-size="12" fill="#64748B">+20% este mes</text>

    <!-- Card 2 -->
    <rect x="220" y="100" width="180" height="120" rx="12" fill="#3B82F6" opacity="0.2"/>
    <rect x="220" y="100" width="180" height="120" rx="12" fill="none" stroke="#3B82F6" stroke-width="2"/>
    <text x="240" y="130" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Trabajos</text>
    <text x="240" y="165" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#60A5FA">47</text>
    <text x="240" y="195" font-family="Arial, sans-serif" font-size="12" fill="#64748B">Completados</text>

    <!-- Card 3 -->
    <rect x="420" y="100" width="180" height="120" rx="12" fill="#F59E0B" opacity="0.2"/>
    <rect x="420" y="100" width="180" height="120" rx="12" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <text x="440" y="130" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Calificación</text>
    <text x="440" y="165" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#FBBF24">4.9</text>
    <text x="440" y="195" font-family="Arial, sans-serif" font-size="12" fill="#64748B">⭐⭐⭐⭐⭐</text>
  </g>

  <!-- Chart area -->
  <rect x="20" y="240" width="580" height="180" rx="12" fill="#1E293B"/>
  <text x="40" y="270" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#E2E8F0">Ingresos del Mes</text>

  <!-- Simple bar chart -->
  <g id="chart">
    <rect x="60" y="340" width="40" height="40" rx="4" fill="#10B981" opacity="0.6"/>
    <rect x="120" y="320" width="40" height="60" rx="4" fill="#10B981" opacity="0.7"/>
    <rect x="180" y="300" width="40" height="80" rx="4" fill="#10B981" opacity="0.8"/>
    <rect x="240" y="290" width="40" height="90" rx="4" fill="#10B981"/>
    <rect x="300" y="310" width="40" height="70" rx="4" fill="#10B981" opacity="0.8"/>
    <rect x="360" y="330" width="40" height="50" rx="4" fill="#10B981" opacity="0.7"/>
    <rect x="420" y="295" width="40" height="85" rx="4" fill="#10B981" opacity="0.9"/>
  </g>

  <!-- Side panel - Recent clients -->
  <rect x="620" y="100" width="160" height="320" rx="12" fill="#1E293B"/>
  <text x="640" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E2E8F0">Clientes Recientes</text>

  <!-- Client avatars -->
  <circle cx="650" cy="160" r="15" fill="#10B981"/>
  <text x="642" y="167" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFF">J</text>
  <text x="675" y="167" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">Juan P.</text>

  <circle cx="650" cy="200" r="15" fill="#3B82F6"/>
  <text x="642" y="207" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFF">M</text>
  <text x="675" y="207" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">María G.</text>

  <circle cx="650" cy="240" r="15" fill="#F59E0B"/>
  <text x="642" y="247" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFF">C</text>
  <text x="675" y="247" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">Carlos R.</text>

  <circle cx="650" cy="280" r="15" fill="#8B5CF6"/>
  <text x="642" y="287" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFF">L</text>
  <text x="675" y="287" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">Laura S.</text>

  <!-- Decorative gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#grad1)"/>
</svg>
