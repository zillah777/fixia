  <circle cx="845" cy="410" r="18" fill="#fbbf24" opacity="0.2"/>
  <rect x="875" y="398" width="160" height="12" rx="2" fill="#f1f5f9"/>
  <rect x="875" y="418" width="100" height="10" rx="2" fill="#64748b"/>
  <rect x="1080" y="398" width="45" height="24" rx="4" fill="#fbbf24"/>

