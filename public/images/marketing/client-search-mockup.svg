<svg width="640" height="800" viewBox="0 0 640 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="640" height="800" fill="#FFFFFF"/>
  
  <!-- Subtle gradient background -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F1F5F9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="640" height="800" fill="url(#bg-gradient)"/>

  <!-- Header -->
  <rect x="30" y="30" width="580" height="60" rx="12" fill="#0F172A"/>
  <text x="50" y="68" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">Buscar Profesionales</text>
  
  <!-- Search bar -->
  <rect x="30" y="110" width="580" height="50" rx="25" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="60" y="142" font-family="Arial, sans-serif" font-size="16" fill="#94A3B8">Plomería, electricidad, carpintería...</text>
  
  <!-- Filters -->
  <g id="filters">
    <rect x="30" y="180" width="100" height="36" rx="18" fill="#3B82F6"/>
    <text x="50" y="203" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Todos</text>
    
    <rect x="145" y="180" width="110" height="36" rx="18" fill="#F1F5F9"/>
    <text x="165" y="203" font-family="Arial, sans-serif" font-size="13" fill="#475569">Plomería</text>
    
    <rect x="270" y="180" width="140" height="36" rx="18" fill="#F1F5F9"/>
    <text x="290" y="203" font-family="Arial, sans-serif" font-size="13" fill="#475569">Electricidad</text>
  </g>

  <!-- Professional Cards -->
  <g id="professional-cards">
    <!-- Card 1 -->
    <rect x="30" y="240" width="580" height="140" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    
    <circle cx="85" cy="310" r="35" fill="#3B82F6"/>
    <text x="70" y="320" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF">JP</text>
    
    <text x="140" y="290" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">Juan Pérez</text>
    <text x="140" y="315" font-family="Arial, sans-serif" font-size="14" fill="#64748B">Plomero Profesional</text>
    <text x="140" y="340" font-family="Arial, sans-serif" font-size="14" fill="#64748B">⭐ 4.9 (127 reseñas)</text>
    
    <rect x="480" y="290" width="100" height="36" rx="8" fill="#3B82F6"/>
    <text x="502" y="313" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Contactar</text>

    <!-- Card 2 -->
    <rect x="30" y="400" width="580" height="140" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    
    <circle cx="85" cy="470" r="35" fill="#10B981"/>
    <text x="70" y="480" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF">MG</text>
    
    <text x="140" y="450" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">María González</text>
    <text x="140" y="475" font-family="Arial, sans-serif" font-size="14" fill="#64748B">Electricista Certificada</text>
    <text x="140" y="500" font-family="Arial, sans-serif" font-size="14" fill="#64748B">⭐ 5.0 (89 reseñas)</text>
    
    <rect x="480" y="450" width="100" height="36" rx="8" fill="#10B981"/>
    <text x="502" y="473" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Contactar</text>

    <!-- Card 3 -->
    <rect x="30" y="560" width="580" height="140" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    
    <circle cx="85" cy="630" r="35" fill="#F59E0B"/>
    <text x="70" y="640" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF">CR</text>
    
    <text x="140" y="610" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">Carlos Ruiz</text>
    <text x="140" y="635" font-family="Arial, sans-serif" font-size="14" fill="#64748B">Carpintero Experto</text>
    <text x="140" y="660" font-family="Arial, sans-serif" font-size="14" fill="#64748B">⭐ 4.8 (156 reseñas)</text>
    
    <rect x="480" y="610" width="100" height="36" rx="8" fill="#F59E0B"/>
    <text x="502" y="633" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Contactar</text>
  </g>

  <!-- Bottom indicator -->
  <circle cx="300" cy="750" r="6" fill="#3B82F6"/>
  <circle cx="320" cy="750" r="6" fill="#CBD5E1"/>
  <circle cx="340" cy="750" r="6" fill="#CBD5E1"/>

  <!-- Decorative elements -->
  <rect x="0" y="0" width="640" height="800" fill="none" stroke="#E2E8F0" stroke-width="1"/>
</svg>
