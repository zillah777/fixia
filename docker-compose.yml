version: '3.8'

services:
  app:
    container_name: fixia-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - HOSTNAME=0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - fixia-network

  db:
    container_name: fixia-db
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=fixia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fixia"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fixia-network

  tunnel:
    container_name: fixia-tunnel
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel run --token ${TUNNEL_TOKEN}
    depends_on:
      - app
    network_mode: service:app

networks:
  fixia-network:
    driver: bridge

volumes:
  postgres_data:
