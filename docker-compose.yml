version: '3.8'

services:
  app:
    container_name: fixia-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/fixia
      - NEXT_PUBLIC_APP_URL=https://fixia.app
      - JWT_SECRET=your_super_secret_jwt_key_at_least_32_characters_long_for_production
      - NEXTAUTH_SECRET=your_nextauth_secret_key_at_least_32_characters_long
      - NEXTAUTH_URL=https://fixia.app
      - RESEND_API_KEY=re_SmYmMSFS_JGXSrxyhM58yWfAFVhMXgu81
      - MP_ACCESS_TOKEN=APP_USR-956733169080479-070920-866ae729476004c75f35987fd053b08c-169925973
      - MERCADOPAGO_WEBHOOK_SECRET=f90de58e8c4bb951d37e12fc49c9027ec0c584d23a6c7a2e749c8766ce895eb4
      - CLOUDINARY_API_KEY=265223179544254
      - CLOUDINARY_API_SECRET=Cdi9wGiVeXc5abmcQdJ9_bFsbYM
      - NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=dgoc9tfoz
      - CRON_SECRET=fixia-subscription-cron-job-2025-secure-secret-key
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - fixia-network

  db:
    container_name: fixia-db
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=fixia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fixia"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fixia-network

  tunnel:
    container_name: fixia-tunnel
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel run --token ${TUNNEL_TOKEN}
    depends_on:
      - app
    networks:
      - fixia-network

networks:
  fixia-network:
    driver: bridge

volumes:
  postgres_data:
